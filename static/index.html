<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Codex — командный доступ</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --border:#262b36; --text:#e6e8ec; --muted:#9099a8; --accent:#4f7cff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .who { color:var(--muted); font-size:13px; }
  #login { max-width:360px; margin:80px auto; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:24px; }
  #login input { width:100%; padding:10px 12px; margin-top:10px; border-radius:8px; border:1px solid var(--border); background:#0f1115; color:var(--text); }
  #login button, .send-btn { margin-top:14px; width:100%; padding:10px; border:none; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  #chat-wrap { flex:1; display:none; flex-direction:column; overflow:hidden; }
  #messages { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:75%; padding:12px 14px; border-radius:12px; white-space:pre-wrap; line-height:1.45; font-size:14px; }
  .msg.user { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:2px; }
  .msg.codex { align-self:flex-start; background:var(--panel); border:1px solid var(--border); border-bottom-left-radius:2px; }
  .msg .cmds { margin-top:8px; font-size:12px; color:var(--muted); border-top:1px solid var(--border); padding-top:6px; }
  .msg.pending { opacity:0.6; }
  #inputbar { display:flex; gap:10px; padding:16px 20px; border-top:1px solid var(--border); }
  #inputbar textarea { flex:1; resize:none; min-height:44px; max-height:160px; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:#0f1115; color:var(--text); font-family:inherit; font-size:14px; }
  .send-btn { width:100px; }
  #err { color:#ff6b6b; font-size:13px; margin-top:8px; min-height:16px; }
</style>
</head>
<body>

<div id="login">
  <h2 style="margin-top:0;">Вход</h2>
  <p style="color:var(--muted); font-size:13px;">Введите персональный токен доступа к Codex (выдаётся тем, кто настраивал среду).</p>
  <input id="tokenInput" type="password" placeholder="Ваш токен" />
  <button onclick="doLogin()">Войти</button>
  <div id="err"></div>
</div>

<div id="chat-wrap">
  <header>
    <h1>Codex — <span id="whoami"></span></h1>
    <span class="who">Ответы генерируются автономно и применяются к рабочей копии проекта</span>
  </header>
  <div id="messages"></div>
  <div id="inputbar">
    <textarea id="msgInput" placeholder="Спросите про сервис или попросите доработку..."></textarea>
    <button class="send-btn" onclick="send()">Отправить</button>
  </div>
</div>

<script>
let token = localStorage.getItem('codex_token') || '';

function esc(s){ const d=document.createElement('div'); d.innerText = s ?? ''; return d.innerHTML; }

async function doLogin(){
  const t = document.getElementById('tokenInput').value.trim();
  if(!t){ return; }
  token = t;
  const res = await fetch('/api/whoami', { headers: { 'Authorization': 'Bearer ' + token } });
  if(!res.ok){
    document.getElementById('err').innerText = 'Неверный токен';
    return;
  }
  localStorage.setItem('codex_token', token);
  await enterChat();
}

async function enterChat(){
  const res = await fetch('/api/whoami', { headers: { 'Authorization': 'Bearer ' + token } });
  if(!res.ok){ return; }
  const data = await res.json();
  document.getElementById('login').style.display = 'none';
  document.getElementById('chat-wrap').style.display = 'flex';
  document.getElementById('whoami').innerText = data.display_name;
  await loadHistory();
}

async function loadHistory(){
  const res = await fetch('/api/history', { headers: { 'Authorization': 'Bearer ' + token } });
  if(!res.ok) return;
  const data = await res.json();
  const box = document.getElementById('messages');
  box.innerHTML = '';
  for(const h of data.history){
    appendMsg('user', h.message);
    appendMsg('codex', h.reply || '(нет ответа, см. лог)');
  }
}

function appendMsg(role, text, pending){
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + role + (pending ? ' pending' : '');
  div.innerText = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}

async function send(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  appendMsg('user', text);
  const pendingDiv = appendMsg('codex', 'Codex выполняет запрос...', true);

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    pendingDiv.classList.remove('pending');
    if(!res.ok){
      pendingDiv.innerText = 'Ошибка: ' + (data.detail || res.status);
      return;
    }
    pendingDiv.innerText = data.reply;
    if(data.commands && data.commands.length){
      const cmds = document.createElement('div');
      cmds.className = 'cmds';
      cmds.innerText = 'Выполненные команды: ' + data.commands.map(c => (c.command || []).join(' ')).join(' | ');
      pendingDiv.appendChild(cmds);
    }
  } catch(e){
    pendingDiv.classList.remove('pending');
    pendingDiv.innerText = 'Ошибка сети: ' + e;
  }
}

document.getElementById('msgInput')?.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});

if(token){ enterChat(); }
</script>
</body>
</html>
