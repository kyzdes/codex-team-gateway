services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Проект
      PROJECT_REPO: ${PROJECT_REPO}
      PROJECT_BASE_BRANCH: ${PROJECT_BASE_BRANCH:-main}
      PROJECT_PROD_URL: ${PROJECT_PROD_URL:-}
      PROJECT_HEALTH_PATH: ${PROJECT_HEALTH_PATH:-/healthz}
      PROJECT_TEST_CMD: ${PROJECT_TEST_CMD:-}
      # Доступы
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_REQUIRED_CHECK: ${GITHUB_REQUIRED_CHECK:-tests}
      GITHUB_MERGE_METHOD: ${GITHUB_MERGE_METHOD:-squash}
      CODEX_API_KEY: ${CODEX_API_KEY:-}
      USERS: ${USERS}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Агент
      CODEX_SANDBOX: ${CODEX_SANDBOX:-workspace-write}
      CODEX_NETWORK_ACCESS: ${CODEX_NETWORK_ACCESS:-true}
      CODEX_MODEL: ${CODEX_MODEL:-}
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-2}
      # Витрина
      BRAND_NAME: ${BRAND_NAME:-Правки}
      BRAND_SUBTITLE: ${BRAND_SUBTITLE:-изменения на сайте без разработчика}
      BRAND_ACCENT: ${BRAND_ACCENT:-#3f6fff}
      # Слежение за выкаткой (необязательно)
      DOKPLOY_URL: ${DOKPLOY_URL:-}
      DOKPLOY_TOKEN: ${DOKPLOY_TOKEN:-}
      DOKPLOY_APPLICATION_ID: ${DOKPLOY_APPLICATION_ID:-}
    expose:
      # Порт НЕ публикуется на хост: наружу сервис выходит только через
      # домен Dokploy (вкладка Domains), где стоит HTTPS и, при желании,
      # Basic Auth или ограничение по IP.
      - "8787"
    volumes:
      - data:/data                    # репозиторий, worktree, база заявок, логи
      - codex_home:/home/agent/.codex  # авторизация Codex, переживает редеплой
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/health-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  data:
  codex_home:
